name: Test and deploy website and backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Backend localization and question bank tests
        run: python -m unittest discover -s backend/tests -v
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Validate question bank mathematics
        working-directory: frontend
        run: node scripts/validate-question-math.mjs
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser language tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Pages frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ROUTER_MODE: hash
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://jae-quiz.onrender.com' }}
        run: npm run build
      - name: Test Pages production routing
        working-directory: frontend
        run: npx playwright test --config playwright.pages.config.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy and verify the exact backend revision
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          BACKEND_URL: ${{ vars.VITE_API_BASE_URL || 'https://jae-quiz.onrender.com' }}
          EXPECTED_RENDER_SERVICE_ID: srv-db4cjne0tbcc73du9a1g
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/deploy_backend.py

  verify-live:
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.deploy.result == 'success' }}
    needs: [deploy, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify published website and real question API
        working-directory: frontend
        env:
          LIVE_API_URL: https://jae-quiz.onrender.com
          LIVE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npx playwright test --config playwright.live.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-site-test-results
          path: frontend/test-results
